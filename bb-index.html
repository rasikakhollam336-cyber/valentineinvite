<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Valentine Surprise ❤️</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
}

/* Cards */
.card {
    background: white;
    padding: 45px;
    width: 440px;
    border-radius: 25px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.2);
}

button {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 12px 0;
    border: none;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    background: #eee;
    transition: .25s;
}

button:hover {
    background: #ff4d6d;
    color: white;
}

/* Final Screen */
.final {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    pointer-events: none;
    text-align: center;
    transition: 1s;
}

.show {
    opacity: 1;
    pointer-events: auto;
}

/* Animated words */
.word {
    font-size: 44px;
    font-weight: bold;
    opacity: 0;
    margin: 6px;
    transform: translateY(20px);
    transition: .5s;
}

/* Buttons */
.choiceBox {
    position: relative;
    width: 260px;
    height: 120px;
    display: none;
    margin-top: 20px;
}

.choiceBtn {
    width: 120px;
    height: 45px;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    position: absolute;
}

#yesBtn {
    left: 0;
}

#noBtn {
    left: 140px;
}

/* Monkey GIF */
#monkeyGif {
    width: 280px;
    margin-top: 25px;
    border-radius: 20px;
    opacity: 0;
    transform: scale(.7);
    transition: 1s;
}

/* Hearts */
.heart {
    position: fixed;
    bottom: -20px;
    font-size: 22px;
    animation: float 6s linear infinite;
}

@keyframes float {
    to {
        transform: translateY(-110vh);
        opacity: 0;
    }
}
</style>
</head>
<body>

<!-- Intro -->
<div class="card" id="introCard">
    <h2>Pashudi ❤️</h2>
    <p style="font-size: 18px;">
        Since this is our first Valentine’s Day together…  
        let’s see how well you know <b>us</b>.
    </p>
    <button onclick="startQuiz()">Start Quiz 💌</button>
</div>

<!-- Quiz -->
<div class="card" id="quizCard" style="display:none;">
    <h2 id="questionText"></h2>
    <div id="answers"></div>
</div>

<!-- Unlock -->
<div class="card" id="unlockCard" style="display:none;">
    <h2>Wowww 😍</h2>
    <p>You really know us *so well*! Ready to unlock your surprise?</p>
    <button onclick="unlockFinal()">Unlock Surprise 🎉</button>
</div>

<!-- Final -->
<div class="final" id="finalScreen">
    <div id="wordsContainer"></div>

    <div class="choiceBox" id="choices">
        <button class="choiceBtn" id="yesBtn">YES ❤️</button>
        <button class="choiceBtn" id="noBtn">NO 😢</button>
    </div>

    <!-- Working direct link monkey GIF -->
    <img id="monkeyGif" 
         src="https://media.tenor.com/7pgpLP9N2joAAAAM/monkey-monkey-hug.gif" 
         alt="Small monkey hugging big monkey">
</div>

<script>
/* Quiz Data */
const questions = [
    {
        q: "Where have we been on a trip for the longest time?",
        options: ["Bali", "Vietnam", "Russia", "Sri Lanka"],
        correct: "Vietnam"
    },
    {
        q: "What can I not live without?",
        options: ["Sleep", "Saunf", "Chia seeds", "Chips"],
        correct: "Saunf"
    },
    {
        q: "Am I a beach person or a mountain person?",
        options: ["Beach", "Mountains"],
        correct: "Beach"
    },
    {
        q: "You are not:",
        options: ["Hanesh", "Pashudi", "Pashupaplu", "Shonpaplu"],
        correct: "Hanesh"
    },
    {
        q: "When did we last go on a date?",
        options: ["December", "November", "January", "February"],
        correct: "December",
        extra: "Uff… it’s been a little too long? You have to make up for it 😏"
    }
];

let current = 0;

// start quiz
function startQuiz() {
    document.getElementById("introCard").style.display = "none";
    document.getElementById("quizCard").style.display = "block";
    loadQuestion();
}

// shuffle
function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
}

// load question
function loadQuestion() {
    const q = questions[current];
    document.getElementById("questionText").innerText = q.q;
    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    shuffle(q.options).forEach(option => {
        const btn = document.createElement("button");
        btn.innerText = option;
        btn.onclick = () => {
            if (option === q.correct) {
                if (q.extra) alert(q.extra);
                current++;
                if (current < questions.length) {
                    loadQuestion();
                } else {
                    document.getElementById("quizCard").style.display = "none";
                    document.getElementById("unlockCard").style.display = "block";
                }
            } else {
                btn.innerText = "I thought you knew this 🥺";
                btn.style.background = "#ff4d6d";
                btn.style.color = "white";
            }
        };
        answersDiv.appendChild(btn);
    });
}

// final reveal
function unlockFinal() {
    document.getElementById("unlockCard").style.display = "none";
    document.getElementById("finalScreen").classList.add("show");

    const words = ["Will", "you", "be", "my", "Valentine?"];
    const container = document.getElementById("wordsContainer");
    let i = 0;

    const interval = setInterval(() => {
        if (i < words.length) {
            const div = document.createElement("div");
            div.className = "word";
            div.innerText = words[i];
            container.appendChild(div);
            setTimeout(() => { div.style.opacity = 1; div.style.transform = "translateY(0)"; }, 100);
            i++;
        } else {
            clearInterval(interval);
            document.getElementById("choices").style.display = "block";
        }
    }, 450);
}

// runaway NO
const noBtn = document.getElementById("noBtn");
noBtn.addEventListener("mouseover", moveNo);
noBtn.addEventListener("click", moveNo);
function moveNo() {
    const parent = noBtn.parentElement.getBoundingClientRect();
    const x = Math.random() * (parent.width - 120);
    const y = Math.random() * (parent.height - 45);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}

// YES
document.getElementById("yesBtn").onclick = function () {
    const gif = document.getElementById("monkeyGif");
    gif.style.opacity = 1;
    gif.style.transform = "scale(1)";

    for (let k = 0; k < 120; k++) {
        const conf = document.createElement("div");
        conf.className = "confetti";
        conf.style.left = Math.random() * 100 + "vw";
        conf.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        document.body.appendChild(conf);
        setTimeout(() => conf.remove(), 3000);
    }
    setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "heart";
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 6000);
    }, 300);

    alert("Best decision ever ❤️ Invite’s coming!");
};
</script>

</body>
</html>
